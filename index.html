<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel UNIFAHE</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
    margin-top:0;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0d6efd;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

button{
    background:#198754;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#157347;
}
</style>

</head>

<body>

<header>
PAINEL UNIFAHE
</header>

<div class="container">

<div class="card">

<h2>Diplomas</h2>

<table>

<tr>
<th>Aluno</th>
<th>Curso</th>
<th>Status</th>
</tr>

<tr>
<td>Exemplo</td>
<td>Administração</td>
<td>Emitido</td>
</tr>

</table>

<br>

<button>Novo Diploma</button>

</div>

</div>

</body>
</html>
