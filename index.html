<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel UNIFAHE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#07172d;
color:white;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100vh;
background:#08101d;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#f7941d;
margin-bottom:40px;
}

.logo span{
color:white;
}

.menu a{
display:block;
color:#cfd6df;
text-decoration:none;
padding:15px;
margin-bottom:10px;
border-radius:8px;
}

.menu a:hover{
background:#f7941d;
color:white;
}

.main{
margin-left:250px;
padding:30px;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.titulo{
font-size:32px;
font-weight:bold;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:#0d213d;
padding:25px;
border-radius:15px;
}

.numero{
font-size:42px;
font-weight:bold;
color:#f7941d;
margin-top:15px;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
<span>UNIFAHE</span>
</div>

<div class="menu">

<a href="#">🏠 Dashboard</a>

<a href="#">📦 Lotes</a>

<a href="#">⚠ Pendências</a>

<a href="#">📚 Cursos</a>

<a href="#">📄 Relatórios</a>

<a href="#">⚙ Configurações</a>

</div>

</div>

<div class="main">

<div class="topo">

<div class="titulo">
Painel de Matrículas
</div>

</div>

<div class="cards">

<div class="card">
<h3>Matriculados</h3>
<div class="numero">0</div>
</div>

<div class="card">
<h3>Faltam</h3>
<div class="numero">0</div>
</div>

<div class="card">
<h3>Hoje</h3>
<div class="numero">0</div>
</div>

<div class="card">
<h3>Pendências</h3>
<div class="numero">0</div>
</div>

</div>

</div>

</body>
</html>
